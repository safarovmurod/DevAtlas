name: Temporary design comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'codex/design-upgrade'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
    steps:
      - name: Checkout screenshot harness
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: capture-harness
      - name: Checkout application revision
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.version == 'before' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          path: app
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Install browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Build
        working-directory: app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
      - name: Diagnose course plan overflow
        if: matrix.version == 'after'
        continue-on-error: true
        working-directory: app
        run: npx playwright test e2e/courses.spec.ts --project=desktop --grep 'returning learner' --retries=0
        env:
          PLAYWRIGHT_PROD_SERVER: 'true'
      - name: Capture screens
        working-directory: app
        env:
          DESIGN_CAPTURE_DIR: ${{ runner.temp }}/design-${{ matrix.version }}
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          AI_TUTOR_ENABLED: 'false'
        run: |
          cp ../capture-harness/scripts/capture-design-comparison.mjs scripts/capture-design-comparison.mjs
          npm run start -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/design-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-design-comparison.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-${{ matrix.version }}-screenshots
          path: ${{ runner.temp }}/design-${{ matrix.version }}
          retention-days: 7
          if-no-files-found: error
